spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
spring.application.name=freedoms-shop-mvc
server.port=${PORT:8080}

# MySQL 8 - create freedoms_shop by running database/freedoms_shop_mysql.sql first.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/freedoms_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The SQL script is the source of truth; Hibernate must not silently create/drop tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.mvc.hiddenmethod.filter.enabled=true
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# First-start demo accounts. Change these values after the first successful login.
app.seed.enabled=${SEED_DEMO_DATA:true}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@company.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:adminTest!123}
app.seed.employee-email=${SEED_EMPLOYEE_EMAIL:staff01@company.com}
app.seed.employee-password=${SEED_EMPLOYEE_PASSWORD:staffTest!123}

# VietQR is only a payment instruction image. Staff still confirms received money manually.
app.payment.bank-code=${BANK_CODE:MB}
app.payment.bank-account=${BANK_ACCOUNT:}
app.payment.bank-account-name=${BANK_ACCOUNT_NAME:FREEDOMS SHOE STORE}
app.payment.bank-name=${BANK_NAME:MB Bank}

# Vue 3 API - Vue dev server proxies /api and /login to this Spring MVC backend.
app.frontend.dev-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# GHN quotation is optional; region fallback is used when credentials or address codes are missing.
app.shipping.ghn.base-url=${GHN_BASE_URL:https://online-gateway.ghn.vn/shiip/public-api}
app.shipping.ghn.token=${GHN_TOKEN:}
app.shipping.ghn.shop-id=${GHN_SHOP_ID:}
app.shipping.ghn.service-type-id=${GHN_SERVICE_TYPE_ID:2}
app.shipping.free-threshold=${SHIPPING_FREE_THRESHOLD:1000000}
app.shipping.fallback.hanoi=${SHIPPING_FALLBACK_HANOI:20000}
app.shipping.fallback.danang=${SHIPPING_FALLBACK_DANANG:32000}
app.shipping.fallback.hcm=${SHIPPING_FALLBACK_HCM:38000}
app.shipping.fallback.other=${SHIPPING_FALLBACK_OTHER:30000}

# Local image storage for product and variant photos
app.upload.dir=${UPLOAD_DIR:uploads/products}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=24MB
