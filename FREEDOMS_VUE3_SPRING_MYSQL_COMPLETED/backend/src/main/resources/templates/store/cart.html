<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giỏ hàng | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div>
<div class="page-head"><div class="container"><div class="eyebrow">YOUR BAG</div><h1 class="page-title">Giỏ hàng</h1></div></div><main class="container"><div th:replace="~{fragments/messages :: messages}"></div>
<div class="empty" th:if="${#lists.isEmpty(lines)}"><h2>Giỏ hàng đang trống</h2><p class="muted">Khám phá sản phẩm để bắt đầu mua sắm.</p><a class="btn" th:href="@{/products}">XEM SẢN PHẨM</a></div>
<div class="two-col" th:unless="${#lists.isEmpty(lines)}"><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th>Số lượng</th><th>Thành tiền</th><th></th></tr></thead><tbody>
<tr th:each="line:${lines}"><td><strong th:text="${line.variant.product.productName}"></strong><br><small class="muted" th:text="${line.variant.sku + ' · ' + (line.variant.size != null ? line.variant.size.sizeLabel : '') + ' · ' + (line.variant.color != null ? line.variant.color.colorName : '')}"></small></td>
<td th:text="${#numbers.formatDecimal(line.variant.unitPrice,0,'COMMA',0,'POINT')} + ' đ'"></td><td><form class="inline-form" th:action="@{/cart/update}" method="post"><input type="hidden" name="variantId" th:value="${line.variant.id}"><input type="number" min="0" name="quantity" th:value="${line.quantity}"><button class="btn btn-outline btn-small">Cập nhật</button></form></td>
<td th:text="${#numbers.formatDecimal(line.lineTotal,0,'COMMA',0,'POINT')} + ' đ'"></td><td><form th:action="@{/cart/remove}" method="post"><input type="hidden" name="variantId" th:value="${line.variant.id}"><button class="btn btn-danger btn-small">Xóa</button></form></td></tr></tbody></table></div>
<div class="summary"><h3>Tóm tắt đơn hàng</h3><div class="summary-row"><span>Tạm tính</span><strong th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + ' đ'"></strong></div><div class="summary-row"><span>Phí vận chuyển</span><span>Tính khi xác nhận</span></div><div class="summary-row summary-total"><span>Tổng</span><span th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + ' đ'"></span></div><a class="btn" style="width:100%;margin-top:18px" th:href="@{/checkout}">TIẾN HÀNH ĐẶT HÀNG</a><a class="btn btn-outline" style="width:100%;margin-top:10px" th:href="@{/products}">TIẾP TỤC MUA SẮM</a></div></div>
</main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
