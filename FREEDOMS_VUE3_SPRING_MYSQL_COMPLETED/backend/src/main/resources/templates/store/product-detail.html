<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${product.productName} + ' | FREEDOMS'"></title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div>
<main class="container section"><div th:replace="~{fragments/messages :: messages}"></div><div class="two-col"><div><img style="width:100%;max-height:520px;object-fit:cover;border-radius:8px;background:#f5f6f3" th:src="${product.imageUrl}" th:alt="${product.productName}"></div>
<div><div class="eyebrow" th:text="${product.brand != null ? product.brand.brandName : 'FREEDOMS'}"></div><h1 class="page-title" th:text="${product.productName}"></h1><p class="muted" th:text="${product.description}"></p><div class="panel"><h3>Chọn phiên bản</h3><form th:action="@{/cart/add}" method="post"><div class="field"><label>Size / Màu / SKU</label><select name="variantId" required><option value="">-- Chọn biến thể --</option><option th:each="v:${variants}" th:value="${v.id}" th:text="${(v.size != null ? 'Size ' + v.size.sizeLabel : 'Chưa chọn size') + ' - ' + (v.color != null ? v.color.colorName : 'Màu mặc định') + ' | ' + v.sku + ' | ' + #numbers.formatDecimal(v.unitPrice,0,'COMMA',0,'POINT') + ' đ | Còn ' + v.stockQuantity}"></option></select></div><div class="field"><label>Số lượng</label><input type="number" name="quantity" min="1" value="1" required></div><div class="row-actions"><button class="btn" type="submit">THÊM VÀO GIỎ HÀNG</button><button class="btn btn-outline" type="submit" name="redirectTo" value="checkout">MUA NGAY</button></div></form><p class="muted" style="font-size:12px;margin-top:14px">Tồn kho sẽ được kiểm tra lại ở thời điểm đặt hàng.</p></div><p style="margin-top:20px"><a class="link" th:href="@{/products}">← Quay lại sản phẩm</a></p></div></div></main>
<div th:replace="~{fragments/footer :: footer}"></div></body></html>
