<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div class="auth-card" style="width:min(700px,100%);margin:auto"><div class="eyebrow">MY FREEDOMS ACCOUNT</div><h1>Thông tin tài khoản</h1><p><strong>Họ tên:</strong> <span th:text="${user.fullName}"></span></p><p><strong>Email:</strong> <span th:text="${user.email}"></span></p><p><strong>Điện thoại:</strong> <span th:text="${user.phone}"></span></p><p><strong>Hạng thành viên:</strong> <span th:text="${user.tier != null ? user.tier.tierName : 'Mới'}"></span></p><p><strong>Tổng chi tiêu:</strong> <span th:text="${#numbers.formatDecimal(user.totalSpent,0,'COMMA',0,'POINT')} + ' đ'"></span></p><a class="btn" th:href="@{/orders}">XEM ĐƠN HÀNG</a></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
