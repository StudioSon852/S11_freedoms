<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div>
<div class="auth-wrap"><div class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Đăng nhập</h1><p class="muted">Đăng nhập tài khoản FREEDOMS của bạn.</p><div th:replace="~{fragments/messages :: messages}"></div>
<form th:action="@{/login}" method="post"><div class="field"><label>Email</label><input type="email" name="email" autocomplete="username" required></div><div class="field"><label>Mật khẩu</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn" type="submit">ĐĂNG NHẬP</button></form>
<p class="muted" style="margin-top:20px;text-align:center">Chưa có tài khoản? <a class="link" th:href="@{/register}">Đăng ký ngay</a></p></div></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
