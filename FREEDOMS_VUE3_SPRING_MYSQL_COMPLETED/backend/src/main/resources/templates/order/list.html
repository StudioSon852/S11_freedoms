<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đơn hàng của tôi | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="page-head"><div class="container"><div class="eyebrow">MY ORDERS</div><h1 class="page-title">Đơn hàng của tôi</h1></div></div><main class="container"><div th:replace="~{fragments/messages :: messages}"></div>
<div class="empty" th:if="${#lists.isEmpty(orders)}">Bạn chưa có đơn hàng nào. <a class="link" th:href="@{/products}">Mua sắm ngay</a></div>
<div class="table-wrap" th:unless="${#lists.isEmpty(orders)}"><table><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Kênh</th><th>Trạng thái</th><th>Tổng tiền</th><th></th></tr></thead><tbody><tr th:each="o:${orders}"><td><strong th:text="${o.orderCode}"></strong></td><td th:text="${o.createdAt}"></td><td th:text="${o.salesChannel}"></td><td><span class="badge-status" th:text="${o.orderStatus}"></span></td><td th:text="${#numbers.formatDecimal(o.totalAmount,0,'COMMA',0,'POINT')} + ' đ'"></td><td><a class="link" th:href="@{/orders/{id}(id=${o.id})}">Chi tiết</a></td></tr></tbody></table></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
