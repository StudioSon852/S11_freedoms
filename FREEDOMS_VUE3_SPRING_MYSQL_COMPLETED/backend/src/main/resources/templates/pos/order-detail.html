<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phiếu bán hàng | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div th:replace="~{fragments/messages :: messages}"></div><div class="section-head"><div><div class="eyebrow">POS SALE</div><h1 class="page-title" th:text="${order.orderCode}"></h1></div><span class="badge-status" th:text="${order.orderStatus}"></span></div>
<div class="two-col"><div class="panel"><h3>Thông tin khách hàng</h3><p><strong>Khách:</strong> <span th:text="${order.customerName}"></span></p><p><strong>Điện thoại:</strong> <span th:text="${order.customerPhone}"></span></p><p><strong>Kênh:</strong> <span th:text="${order.salesChannel}"></span></p><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>SL</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="i:${items}"><td th:text="${i.productNameSnapshot + ' / ' + i.variantLabelSnapshot}"></td><td th:text="${i.quantity}"></td><td th:text="${#numbers.formatDecimal(i.lineTotal,0,'COMMA',0,'POINT')} + ' đ'"></td></tr></tbody></table></div></div>
<div class="panel"><h3>Thanh toán</h3><p><strong>Phương thức:</strong> <span th:text="${payment.paymentMethod}"></span></p><p><strong>Trạng thái:</strong> <span class="badge-status" th:text="${payment.paymentStatus}"></span></p><h2 class="price" th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT')} + ' đ'"></h2>
<div class="qr-box" th:if="${qrUrl != null}"><img th:src="${qrUrl}" alt="QR chuyển khoản"><p class="muted">Nội dung chuyển khoản: <strong th:text="${order.orderCode}"></strong></p></div><p th:if="${payment.paymentMethod == 'BANK_TRANSFER'}"><strong>Ngân hàng:</strong> <span th:text="${bankName}"></span><br><strong>Tài khoản:</strong> <span th:text="${bankAccount != null && !bankAccount.isBlank() ? bankAccount : 'Chưa cấu hình'}"></span><br><strong>Chủ tài khoản:</strong> <span th:text="${bankAccountName}"></span></p><p class="muted" style="font-size:12px">Nhân viên xác nhận thanh toán trong mục Thanh toán sau khi kiểm tra tài khoản nhận tiền.</p><a class="btn" th:href="@{/employee/payments}">MỞ QUẢN LÝ THANH TOÁN</a></div></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
