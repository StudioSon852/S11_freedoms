<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hóa đơn chờ | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div class="section-head"><div><div class="eyebrow">PERSISTENT POS</div><h1 class="page-title">Hóa đơn chờ</h1></div><a class="btn" th:href="@{/employee/pos}">Tạo hóa đơn mới</a></div><div th:replace="~{fragments/messages :: messages}"></div><div class="alert alert-info">Hóa đơn chờ được lưu trên MySQL, không trừ kho. Chỉ khi chốt bán, hệ thống mới kiểm tra và trừ tồn kho.</div>
<div class="empty" th:if="${#lists.isEmpty(invoices)}">Không có hóa đơn chờ đang mở.</div><div class="table-wrap" th:unless="${#lists.isEmpty(invoices)}"><table><thead><tr><th>Mã hóa đơn</th><th>Khách hàng</th><th>Nhân viên tạo</th><th>Ngày tạo</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="i:${invoices}"><td th:text="${i.heldCode}"></td><td><span th:text="${i.customerName}"></span><br><small th:text="${i.customerPhone}"></small></td><td th:text="${i.createdBy.fullName}"></td><td th:text="${i.createdAt}"></td><td><span class="badge-status" th:text="${i.status}"></span></td><td><a class="link" th:href="@{/employee/held-invoices/{id}(id=${i.id})}">Mở hóa đơn</a></td></tr></tbody></table></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
