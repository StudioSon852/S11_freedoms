<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanh toán | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div class="eyebrow">PAYMENT MANAGEMENT</div><h1 class="page-title">Đơn hàng & thanh toán</h1><div th:replace="~{fragments/messages :: messages}"></div><div class="alert alert-info">Nhân viên chỉ xác nhận thanh toán sau khi đã kiểm tra tiền thực tế về tài khoản. Không xác nhận chỉ dựa trên ảnh QR hoặc thông báo từ khách.</div>
<div class="table-wrap"><table><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Kênh</th><th>Phương thức</th><th>Thanh toán</th><th>Số tiền</th><th></th></tr></thead><tbody><tr th:each="p:${payments}"><td th:text="${p.order.orderCode}"></td><td th:text="${p.order.customerName}"></td><td th:text="${p.order.salesChannel}"></td><td th:text="${p.paymentMethod}"></td><td><span class="badge-status" th:text="${p.paymentStatus}"></span></td><td th:text="${#numbers.formatDecimal(p.amount,0,'COMMA',0,'POINT')} + ' đ'"></td><td><form th:if="${p.paymentStatus != 'PAID' and p.paymentStatus != 'CANCELLED' and p.paymentMethod == 'BANK_TRANSFER'}" th:action="@{/employee/payments/{id}/confirm(id=${p.id})}" method="post" class="inline-form"><input type="text" name="reference" placeholder="Mã giao dịch"><button class="btn btn-small">Xác nhận đã nhận</button></form><span th:if="${p.paymentStatus == 'PAID'}" class="muted">Đã xác nhận</span></td></tr></tbody></table></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
