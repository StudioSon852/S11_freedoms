<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giỏ POS | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div class="section-head"><div><div class="eyebrow">HELD INVOICE DRAFT</div><h1 class="page-title">Giỏ hàng tại quầy</h1></div><a class="btn btn-outline" th:href="@{/employee/pos}">Thêm sản phẩm</a></div><div th:replace="~{fragments/messages :: messages}"></div>
<div class="empty" th:if="${#lists.isEmpty(lines)}">Chưa có sản phẩm trong giỏ POS.</div>
<div th:unless="${#lists.isEmpty(lines)}" class="two-col"><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th>SL</th><th>Thành tiền</th><th></th></tr></thead><tbody><tr th:each="line:${lines}"><td><strong th:text="${line.variant.product.productName}"></strong><br><small class="muted" th:text="${line.variant.sku}"></small></td><td th:text="${#numbers.formatDecimal(line.variant.unitPrice,0,'COMMA',0,'POINT')} + ' đ'"></td><td><form class="inline-form" th:action="@{/employee/pos/cart/update}" method="post"><input type="hidden" name="variantId" th:value="${line.variant.id}"><input type="number" min="0" name="quantity" th:value="${line.quantity}"><button class="btn btn-outline btn-small">Lưu</button></form></td><td th:text="${#numbers.formatDecimal(line.lineTotal,0,'COMMA',0,'POINT')} + ' đ'"></td><td><form th:action="@{/employee/pos/cart/remove}" method="post"><input type="hidden" name="variantId" th:value="${line.variant.id}"><button class="btn btn-danger btn-small">Xóa</button></form></td></tr></tbody></table></div>
<div class="panel"><h3>Lưu hóa đơn chờ</h3><p class="muted">Hóa đơn chờ được lưu xuống database. Thao tác này không trừ tồn kho và chưa ghi nhận doanh thu.</p><form th:action="@{/employee/pos/hold}" method="post"><div class="field"><label>Tên khách hàng</label><input name="customerName" placeholder="Khách lẻ"></div><div class="field"><label>Số điện thoại (nếu có tài khoản sẽ tự áp dụng hạng)</label><input name="customerPhone"></div><div class="field"><label>Mã giảm giá OFFLINE/BOTH</label><input name="couponCode"></div><div class="field"><label>Ghi chú</label><textarea name="customerNote"></textarea></div><button class="btn" type="submit">LƯU HÓA ĐƠN CHỜ</button></form></div></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
