<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết hóa đơn chờ | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div th:replace="~{fragments/messages :: messages}"></div><div class="section-head"><div><div class="eyebrow">HELD INVOICE</div><h1 class="page-title" th:text="${invoice.heldCode}"></h1><p class="muted" th:text="${invoice.customerName + ' · ' + invoice.customerPhone}"></p></div><span class="badge-status" th:text="${invoice.status}"></span></div>
<div class="two-col"><div class="panel"><h3>Sản phẩm đã lưu</h3><div class="table-wrap"><table><thead><tr><th>SKU</th><th>Sản phẩm</th><th>SL</th><th>Đơn giá lưu</th></tr></thead><tbody><tr th:each="i:${items}"><td th:text="${i.skuSnapshot}"></td><td th:text="${i.productNameSnapshot + ' / ' + i.variantLabelSnapshot}"></td><td th:text="${i.quantity}"></td><td th:text="${#numbers.formatDecimal(i.unitPrice,0,'COMMA',0,'POINT')} + ' đ'"></td></tr></tbody></table></div><p><strong>Ghi chú:</strong> <span th:text="${invoice.customerNote}"></span></p></div>
<div class="panel"><h3>Chốt hóa đơn thành đơn hàng</h3><p class="muted">Hệ thống kiểm tra tồn kho và tính lại ưu đãi theo dữ liệu hiện tại trong database.</p><form th:action="@{/employee/held-invoices/{id}/convert(id=${invoice.id})}" method="post"><div class="field"><label>Thanh toán</label><select name="paymentMethod"><option value="CASH">Tiền mặt — xác nhận đã thu ngay</option><option value="BANK_TRANSFER">Chuyển khoản — chờ xác nhận nhận tiền</option></select></div><button class="btn" type="submit">CHỐT BÁN</button></form>
<hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><form th:action="@{/employee/held-invoices/{id}/cancel(id=${invoice.id})}" method="post"><div class="field"><label>Lý do hủy</label><input name="reason" placeholder="Khách không mua / đổi ý"></div><button class="btn btn-danger" type="submit">HỦY HÓA ĐƠN CHỜ</button></form></div></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
