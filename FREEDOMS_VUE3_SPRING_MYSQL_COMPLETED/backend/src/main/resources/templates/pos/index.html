<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div class="section-head"><div><div class="eyebrow">POINT OF SALE</div><h1 class="page-title">Bán hàng tại quầy</h1><p class="muted">Chọn biến thể, thêm vào giỏ POS rồi lưu hóa đơn chờ.</p></div><div class="actions"><a class="btn btn-outline" th:href="@{/employee/pos/cart}">Giỏ POS</a><a class="btn" th:href="@{/employee/held-invoices}">Hóa đơn chờ</a><a class="btn btn-outline" th:href="@{/employee/payments}">Thanh toán</a></div></div><div th:replace="~{fragments/messages :: messages}"></div>
<div class="grid"><article class="product-card" th:each="v:${variants}"><img th:src="${v.product.imageUrl}" th:alt="${v.product.productName}"><div class="product-card-body"><h3 th:text="${v.product.productName}"></h3><p class="muted" th:text="${v.sku + ' · ' + (v.size != null ? 'Size '+v.size.sizeLabel : '') + ' · ' + (v.color != null ? v.color.colorName : '')}"></p><div class="price" th:text="${#numbers.formatDecimal(v.unitPrice,0,'COMMA',0,'POINT')} + ' đ'"></div><p class="muted" th:text="'Tồn: ' + v.stockQuantity"></p><form th:action="@{/employee/pos/add}" method="post" class="inline-form"><input type="hidden" name="variantId" th:value="${v.id}"><input type="number" name="quantity" value="1" min="1" style="width:64px"><button class="btn btn-small" type="submit">Thêm</button></form></div></article></div>
<div class="empty" th:if="${#lists.isEmpty(variants)}">Chưa có biến thể sản phẩm đang bán.</div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
