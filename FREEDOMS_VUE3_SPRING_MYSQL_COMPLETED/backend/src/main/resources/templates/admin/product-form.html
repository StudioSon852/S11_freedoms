<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thêm sản phẩm | Admin</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div class="auth-card" style="width:min(760px,100%);margin:auto"><div class="eyebrow">PRODUCT SETUP</div><h1>Thêm sản phẩm và biến thể đầu tiên</h1><div th:replace="~{fragments/messages :: messages}"></div><form th:action="@{/admin/products}" th:object="${form}" method="post"><div class="form-grid">
<div class="field"><label>Tên sản phẩm</label><input th:field="*{productName}" required></div><div class="field"><label>SKU cha</label><input th:field="*{parentSku}"></div>
<div class="field"><label>Danh mục</label><select th:field="*{categoryId}"><option value="">Không chọn</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.categoryName}"></option></select></div>
<div class="field"><label>Thương hiệu</label><select th:field="*{brandId}"><option value="">Không chọn</option><option th:each="b:${brands}" th:value="${b.id}" th:text="${b.brandName}"></option></select></div>
<div class="field"><label>SKU biến thể</label><input th:field="*{sku}" required></div><div class="field"><label>Giá bán (VNĐ)</label><input type="number" min="1" step="1" th:field="*{unitPrice}" required></div>
<div class="field"><label>Kích cỡ</label><select th:field="*{sizeId}"><option value="">Không chọn</option><option th:each="s:${sizes}" th:value="${s.id}" th:text="${s.sizeLabel}"></option></select></div>
<div class="field"><label>Màu sắc</label><select th:field="*{colorId}"><option value="">Không chọn</option><option th:each="c:${colors}" th:value="${c.id}" th:text="${c.colorName}"></option></select></div>
<div class="field"><label>Tồn kho</label><input type="number" min="0" th:field="*{stockQuantity}" required></div><div class="field"><label>Đường dẫn ảnh</label><input th:field="*{imageUrl}" placeholder="/img/hero-sneakers.jpg"></div></div>
<div class="field"><label>Mô tả</label><textarea th:field="*{description}"></textarea></div><label><input type="checkbox" th:field="*{featured}"> Sản phẩm nổi bật</label><div class="actions" style="margin-top:20px"><button class="btn" type="submit">LƯU SẢN PHẨM</button><a class="btn btn-outline" th:href="@{/admin/products}">Quay lại</a></div></form></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
