<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đơn hàng | Admin</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div class="eyebrow">ORDER MANAGEMENT</div><h1 class="page-title">Đơn hàng & trạng thái</h1><div th:replace="~{fragments/messages :: messages}"></div><div class="table-wrap"><table><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Kênh</th><th>Trạng thái</th><th>Ngày tạo</th><th>Tổng tiền</th><th></th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="${o.orderCode}"></td><td th:text="${o.customerName}"></td><td th:text="${o.salesChannel}"></td><td><span class="badge-status" th:text="${o.orderStatus}"></span></td><td th:text="${o.createdAt}"></td><td th:text="${#numbers.formatDecimal(o.totalAmount,0,'COMMA',0,'POINT')} + ' đ'"></td><td><a class="link" th:href="@{/admin/orders/{id}(id=${o.id})}">Chi tiết</a></td></tr></tbody></table></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
