<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản nhân viên | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div class="two-col"><div><div class="eyebrow">STAFF ACCOUNTS</div><h1 class="page-title">Tài khoản nhân viên</h1><div th:replace="~{fragments/messages :: messages}"></div><div class="table-wrap"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Hoạt động</th></tr></thead><tbody><tr th:each="u:${staff}"><td th:text="${u.fullName}"></td><td th:text="${u.email}"></td><td th:text="${u.role.roleName}"></td><td th:text="${u.active ? 'Có' : 'Không'}"></td></tr></tbody></table></div></div>
<div class="panel"><h3>Tạo tài khoản mới</h3><form th:action="@{/admin/staff}" method="post"><div class="field"><label>Họ tên</label><input name="fullName" required></div><div class="field"><label>Email đăng nhập</label><input name="email" type="email" required></div><div class="field"><label>Số điện thoại</label><input name="phone"></div><div class="field"><label>Mật khẩu</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Vai trò</label><select name="roleCode"><option value="EMPLOYEE">Nhân viên</option><option value="MANAGER">Quản lý</option></select></div><button class="btn" type="submit">TẠO TÀI KHOẢN</button></form></div></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
