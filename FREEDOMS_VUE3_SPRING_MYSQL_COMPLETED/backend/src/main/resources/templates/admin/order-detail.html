<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết đơn | Admin</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div th:replace="~{fragments/messages :: messages}"></div><h1 class="page-title" th:text="${order.orderCode}"></h1><div class="two-col"><div class="panel"><h3>Thông tin đơn hàng</h3><p><strong>Khách:</strong> <span th:text="${order.customerName}"></span></p><p><strong>Điện thoại:</strong> <span th:text="${order.customerPhone}"></span></p><p><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress}"></span></p><p><strong>Trạng thái:</strong> <span class="badge-status" th:text="${order.orderStatus}"></span></p><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>SL</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="i:${items}"><td th:text="${i.productNameSnapshot + ' / ' + i.variantLabelSnapshot}"></td><td th:text="${i.quantity}"></td><td th:text="${#numbers.formatDecimal(i.lineTotal,0,'COMMA',0,'POINT')} + ' đ'"></td></tr></tbody></table></div></div>
<div class="panel"><h3>Cập nhật trạng thái</h3><form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post"><div class="field"><label>Trạng thái mới</label><select name="orderStatus"><option value="CONFIRMED">Đang xác nhận</option><option value="PROCESSING">Đang xử lý</option><option value="SHIPPING">Đang giao hàng</option><option value="COMPLETED">Đã hoàn thành</option><option value="CANCELLED">Đã hủy</option></select></div><div class="field"><label>Ghi chú</label><textarea name="note"></textarea></div><button class="btn" type="submit">CẬP NHẬT</button></form><p class="muted" style="font-size:12px">Đơn chuyển khoản cần được xác nhận đã nhận tiền trước khi chuyển sang xử lý. Đơn đã thanh toán không thể hủy trực tiếp; cần xử lý hoàn tiền trước.</p></div></div>
<section class="panel" style="margin-top:22px"><h3>Lịch sử trạng thái</h3><div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Trước</th><th>Sau</th><th>Ghi chú</th></tr></thead><tbody><tr th:each="h:${history}"><td th:text="${h.createdAt}"></td><td th:text="${h.oldStatus != null ? h.oldStatus : '—'}"></td><td th:text="${h.newStatus}"></td><td th:text="${h.note}"></td></tr></tbody></table></div></section>
</main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
