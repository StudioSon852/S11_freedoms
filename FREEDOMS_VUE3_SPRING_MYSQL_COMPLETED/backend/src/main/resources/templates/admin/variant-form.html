<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thêm biến thể | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div class="auth-card" style="width:min(700px,100%);margin:auto"><div class="eyebrow">PRODUCT VARIANT</div><h1>Thêm size / màu / SKU</h1><form th:action="@{/admin/variants}" method="post"><div class="field"><label>Sản phẩm</label><select name="productId" required><option value="">-- Chọn sản phẩm --</option><option th:each="p:${products}" th:value="${p.id}" th:selected="${productId != null and productId == p.id}" th:text="${p.productName}"></option></select></div><div class="form-grid"><div class="field"><label>Size</label><select name="sizeId"><option value="">Không chọn</option><option th:each="s:${sizes}" th:value="${s.id}" th:text="${s.sizeLabel}"></option></select></div><div class="field"><label>Màu</label><select name="colorId"><option value="">Không chọn</option><option th:each="c:${colors}" th:value="${c.id}" th:text="${c.colorName}"></option></select></div><div class="field"><label>SKU duy nhất</label><input name="sku" required></div><div class="field"><label>Giá bán</label><input name="unitPrice" type="number" min="1" required></div><div class="field"><label>Tồn kho</label><input name="stockQuantity" type="number" min="0" value="0" required></div></div><button class="btn" type="submit">LƯU BIẾN THỂ</button></form></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
