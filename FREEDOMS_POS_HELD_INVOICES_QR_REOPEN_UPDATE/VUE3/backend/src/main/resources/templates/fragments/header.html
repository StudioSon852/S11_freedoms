<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<header class="site-header" th:fragment="header"><div class="container nav">
<a class="logo" th:href="@{/}">FREEDOMS<small>STEP INTO YOUR STYLE</small></a>
<nav class="nav-links"><a th:href="@{/}">Trang chủ</a><a th:href="@{/products}">Sản phẩm</a><a th:href="@{/about}">Giới thiệu</a><a th:href="@{/contact}">Liên hệ</a></nav>
<div class="nav-actions"><a th:href="@{/cart}">Giỏ hàng</a><span sec:authorize="isAnonymous()"><a th:href="@{/login}">Đăng nhập</a></span>
<span sec:authorize="isAuthenticated()" class="muted" th:text="${currentUser != null ? currentUser.fullName : 'Tài khoản'}"></span>
<span sec:authorize="isAuthenticated()"><a th:href="@{/account}">Tài khoản</a></span><span sec:authorize="isAuthenticated()"><a th:href="@{/orders}">Đơn hàng</a></span>
<span sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin}">Quản trị</a></span>
<span sec:authorize="hasRole('MANAGER')"><a th:href="@{/manager}">Quản lý</a></span>
<span sec:authorize="hasAnyRole('ADMIN','MANAGER','EMPLOYEE')"><a th:href="@{/employee/pos}">POS</a></span>
<form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post"><button class="btn btn-outline btn-small" type="submit">Đăng xuất</button></form></div>
</div></header></body></html>
