<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="messages">
<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
<div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
<div class="alert alert-error" th:if="${param.error}">Email hoặc mật khẩu không chính xác, hoặc tài khoản đã bị khóa.</div>
<div class="alert alert-success" th:if="${param.logout}">Bạn đã đăng xuất.</div>
</div></body></html>
