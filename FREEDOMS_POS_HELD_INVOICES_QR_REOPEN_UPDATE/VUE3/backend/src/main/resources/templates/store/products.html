<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sản phẩm | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div>
<div class="page-head"><div class="container"><div class="eyebrow">FREEDOMS COLLECTION</div><h1 class="page-title">Tất cả sản phẩm</h1><p class="muted">Tìm kiếm thiết kế phù hợp với bạn.</p></div></div>
<main class="container"><div th:replace="~{fragments/messages :: messages}"></div><form method="get" th:action="@{/products}" class="actions" style="margin-bottom:25px"><input class="search-input" style="max-width:380px" type="search" name="q" th:value="${q}" placeholder="Tìm tên sản phẩm hoặc SKU"><button class="btn" type="submit">Tìm kiếm</button></form>
<div class="grid"><article class="product-card" th:each="p:${products}"><a th:href="@{/products/{id}(id=${p.id})}"><img th:src="${p.imageUrl}" th:alt="${p.productName}"><div class="product-card-body"><span class="muted" th:text="${p.brand != null ? p.brand.brandName : 'FREEDOMS'}"></span><h3 th:text="${p.productName}"></h3><span class="link">Xem lựa chọn size và màu →</span></div></a></article></div>
<div class="empty" th:if="${#lists.isEmpty(products)}">Không tìm thấy sản phẩm phù hợp.</div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
