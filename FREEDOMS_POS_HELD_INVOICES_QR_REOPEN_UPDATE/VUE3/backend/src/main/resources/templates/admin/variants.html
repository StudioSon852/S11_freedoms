<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biến thể | FREEDOMS</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div class="section-head"><div><div class="eyebrow">SKU / SIZE / COLOR / STOCK</div><h1 class="page-title">Biến thể và tồn kho</h1></div><a class="btn" th:href="@{/admin/variants/new}">THÊM BIẾN THỂ</a></div><div th:replace="~{fragments/messages :: messages}"></div><div class="table-wrap"><table><thead><tr><th>SKU</th><th>Sản phẩm</th><th>Size</th><th>Màu</th><th>Giá</th><th>Tồn kho</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="v:${variants}"><td th:text="${v.sku}"></td><td th:text="${v.product.productName}"></td><td th:text="${v.size != null ? v.size.sizeLabel : '—'}"></td><td th:text="${v.color != null ? v.color.colorName : '—'}"></td><td th:text="${#numbers.formatDecimal(v.unitPrice,0,'COMMA',0,'POINT')} + ' đ'"></td><td th:text="${v.stockQuantity}"></td><td th:text="${v.active ? 'Đang bán' : 'Ngừng bán'}"></td></tr></tbody></table></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
