<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sản phẩm | Admin</title><link rel="stylesheet" th:href="@{/css/freedoms.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container section"><div class="section-head"><div><div class="eyebrow">CATALOG ADMIN</div><h1 class="page-title">Quản lý sản phẩm</h1></div><a class="btn" th:href="@{/admin/products/new}">THÊM SẢN PHẨM</a></div><div th:replace="~{fragments/messages :: messages}"></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Sản phẩm</th><th>SKU cha</th><th>Danh mục</th><th>Thương hiệu</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="p:${products}"><td th:text="${p.id}"></td><td><strong th:text="${p.productName}"></strong></td><td th:text="${p.parentSku}"></td><td th:text="${p.category != null ? p.category.categoryName : '—'}"></td><td th:text="${p.brand != null ? p.brand.brandName : '—'}"></td><td th:text="${p.active ? 'Đang bán' : 'Ngừng bán'}"></td></tr></tbody></table></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
